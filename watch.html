<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CINEORA | Watch</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* NAVBAR */

.navbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:#050505;
    border-bottom:1px solid #222;
}

.logo{
    color:#e50914;
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
}

.back{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

.back:hover{
    color:#fff;
}

/* PLAYER */

.watch-container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:35px 5%;
}

.player{
    width:100%;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 15px 50px rgba(0,0,0,.8);
}

video{
    width:100%;
    display:block;
    background:#000;
    max-height:680px;
}

/* INFO */

.movie-info{
    padding:28px 0;
}

.movie-info h1{
    font-size:38px;
    margin-bottom:12px;
}

.meta{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    color:#aaa;
    margin-bottom:18px;
}

.rating{
    color:#ffd700;
    font-weight:bold;
}

.genres{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.genre{
    background:#222;
    border:1px solid #333;
    padding:6px 12px;
    border-radius:20px;
    color:#ddd;
    font-size:12px;
}

.description{
    color:#aaa;
    line-height:1.7;
    font-size:15px;
}

/* COMING SOON */

.coming-soon{
    min-height:500px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#111;
    border-radius:10px;
}

.coming-soon h2{
    font-size:32px;
    margin-bottom:12px;
}

.coming-soon p{
    color:#999;
    max-width:500px;
    line-height:1.6;
}

/* MOBILE */

@media(max-width:700px){

    .navbar{
        padding:0 5%;
    }

    .logo{
        font-size:22px;
    }

    .watch-container{
        padding:25px 4%;
    }

    .movie-info h1{
        font-size:28px;
    }

    .coming-soon{
        min-height:350px;
    }

    .coming-soon h2{
        font-size:26px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">CINEORA</div>

    <a href="movies.html" class="back">
        ← Back to Movies
    </a>

</nav>


<!-- WATCH AREA -->

<main class="watch-container">

    <div id="playerArea" class="player"></div>

    <section class="movie-info">

        <h1 id="title">Loading...</h1>

        <div class="meta">

            <span id="year"></span>

            <span>•</span>

            <span id="duration"></span>

            <span>•</span>

            <span id="rating" class="rating"></span>

        </div>

        <div id="genres" class="genres"></div>

        <p id="description" class="description"></p>

    </section>

</main>


<!-- MOVIE DATABASE -->

<script src="./movies-data.js"></script>

<script>

const params = new URLSearchParams(
    window.location.search
);

const movieId = params.get("movie");


/* Find selected movie */

const movie = movies.find(function(item){

    return item.id === movieId;

});


/* Movie not found */

if(!movie){

    document.getElementById("playerArea").innerHTML = `
        <div class="coming-soon">
            <h2>Movie Not Found</h2>
            <p>
                The movie you selected could not be found.
            </p>
        </div>
    `;

}


/* Movie found */

else{

    document.title =
        movie.title + " | CINEORA";


    /* Movie information */

    document.getElementById("title").textContent =
        movie.title;

    document.getElementById("year").textContent =
        movie.year;

    document.getElementById("duration").textContent =
        movie.duration;

    document.getElementById("rating").textContent =
        "★ " + movie.rating;

    document.getElementById("description").textContent =
        movie.description;


    /* Genres */

    const genresBox =
        document.getElementById("genres");

    movie.genre.forEach(function(genre){

        const span =
            document.createElement("span");

        span.className = "genre";

        span.textContent = genre;

        genresBox.appendChild(span);

    });


    /* Video */

    const playerArea =
        document.getElementById("playerArea");


    if(movie.video){

        playerArea.innerHTML = `

            <video
                controls
                playsinline
                poster="${movie.poster}"
                preload="metadata"
            >

                <source
                    src="${movie.video}"
                    type="video/mp4"
                >

                Your browser does not support
                HTML5 video.

            </video>

        `;

    }

    else{

        playerArea.innerHTML = `

            <div class="coming-soon">

                <h2>🎬 Coming Soon</h2>

                <p>
                    The video for this movie
                    has not been added yet.
                </p>

            </div>

        `;

    }

}

</script>

</body>
</html>
