<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CINEORA - Watch</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    nav {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: rgba(0, 0, 0, 0.95);
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #e50914;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 22px;
    }

    .nav-links a {
      color: #ddd;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: white;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto 60px;
    }

    .back {
      display: inline-block;
      color: #ddd;
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .back:hover {
      color: white;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .movie-info {
      padding: 25px 0;
    }

    .movie-title {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .meta {
      color: #bbb;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .rating {
      color: #ffd700;
    }

    .genres {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .genre {
      background: #222;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #ddd;
    }

    .description {
      color: #bbb;
      line-height: 1.7;
      max-width: 800px;
    }

    .coming-soon {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: #aaa;
      font-size: 20px;
    }

    .error {
      text-align: center;
      padding: 80px 20px;
      color: #aaa;
    }

    @media (max-width: 700px) {
      .nav-links {
        display: none;
      }

      .movie-title {
        font-size: 26px;
      }

      .container {
        width: 94%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">CINEORA</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <a href="movies.html">Categories</a>
    </div>
  </nav>

  <main class="container">

    <a href="movies.html" class="back">← Back to Movies</a>

    <div id="content"></div>

  </main>

  <script src="./movies-data.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const movieId = params.get("movie");

    const movie = movies.find(item => item.id === movieId);

    const content = document.getElementById("content");

    if (!movie) {

      content.innerHTML = `
        <div class="error">
          <h2>Movie Not Found</h2>
          <p>The movie you are looking for could not be found.</p>
        </div>
      `;

    } else {

      let videoHTML = "";

      /*
        YouTube URL থেকে Video ID বের করা
      */
      if (movie.video && movie.video.includes("youtube")) {

        const videoId = movie.video.match(
          /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/
        );

        if (videoId) {

          videoHTML = `
            <div class="video-box">
              <iframe
                src="https://www.youtube.com/embed/${videoId[1]}"
                title="${movie.title}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
              </iframe>
            </div>
          `;

        }

      }

      /*
        পুরোনো MP4 ভিডিও থাকলে
      */
      else if (movie.video) {

        videoHTML = `
          <div class="video-box">
            <video
              controls
              width="100%"
              height="100%"
              poster="${movie.poster}">
              <source src="${movie.video}" type="video/mp4">
              Your browser does not support video playback.
            </video>
          </div>
        `;

      }

      /*
        Video না থাকলে
      */
      if (!videoHTML) {

        videoHTML = `
          <div class="video-box">
            <div class="coming-soon">
              <div>🎬</div>
              <div>Coming Soon</div>
            </div>
          </div>
        `;

      }

      content.innerHTML = `

        ${videoHTML}

        <section class="movie-info">

          <h1 class="movie-title">${movie.title}</h1>

          <div class="meta">
            ${movie.year}
            &nbsp; • &nbsp;
            ${movie.duration}
            &nbsp; • &nbsp;
            <span class="rating">★ ${movie.rating}</span>
          </div>

          <div class="genres">
            ${movie.genre.map(g => `
              <span class="genre">${g}</span>
            `).join("")}
          </div>

          <p class="description">
            ${movie.description}
          </p>

        </section>
      `;
    }
  </script>

</body>
</html>
