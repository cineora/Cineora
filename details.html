<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Details | CINEORA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
    min-height:100vh;
}

/* NAVBAR */
.navbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(0,0,0,.92);
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
    color:#e50914;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:#ddd;
    text-decoration:none;
    font-size:15px;
    transition:.3s;
}

.nav-links a:hover{
    color:#fff;
}

/* DETAILS */
.details{
    min-height:calc(100vh - 70px);
    padding:60px 7%;
    display:flex;
    align-items:center;
    gap:55px;
    background:
        radial-gradient(circle at 75% 45%,rgba(229,9,20,.18),transparent 35%),
        linear-gradient(90deg,#080808 20%,#101010 100%);
}

.poster{
    width:330px;
    min-width:330px;
    height:490px;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 20px 50px rgba(0,0,0,.7);
}

.info{
    max-width:700px;
}

.info h1{
    font-size:52px;
    line-height:1.1;
    margin-bottom:20px;
}

.meta{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
}

.meta span{
    color:#ccc;
    font-size:15px;
}

.rating{
    color:#ffd700 !important;
    font-weight:bold;
}

.genres{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:25px;
}

.genre{
    background:#222;
    border:1px solid #333;
    padding:7px 13px;
    border-radius:20px;
    color:#ddd;
    font-size:13px;
}

.description{
    color:#bbb;
    font-size:17px;
    line-height:1.8;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    text-decoration:none;
    padding:14px 28px;
    border-radius:7px;
    font-weight:bold;
    transition:.3s;
}

.watch{
    background:#e50914;
    color:#fff;
}

.watch:hover{
    background:#b20710;
    transform:translateY(-2px);
}

.back{
    background:#252525;
    color:#fff;
}

.back:hover{
    background:#333;
}

/* NOT FOUND */
.not-found{
    text-align:center;
    padding:100px 20px;
}

.not-found h1{
    font-size:42px;
    margin-bottom:15px;
}

.not-found p{
    color:#aaa;
    margin-bottom:25px;
}

/* MOBILE */
@media(max-width:800px){

    .navbar{
        padding:0 5%;
    }

    .nav-links{
        gap:12px;
    }

    .nav-links a{
        font-size:12px;
    }

    .logo{
        font-size:22px;
    }

    .details{
        padding:40px 6%;
        flex-direction:column;
        text-align:center;
        gap:35px;
    }

    .poster{
        width:260px;
        min-width:260px;
        height:390px;
    }

    .info{
        max-width:100%;
    }

    .info h1{
        font-size:36px;
    }

    .meta,
    .genres,
    .buttons{
        justify-content:center;
    }

    .description{
        font-size:15px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="logo">CINEORA</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="series.html">Series</a>
        <a href="movies.html">Categories</a>
    </div>

</nav>


<!-- MOVIE DETAILS -->
<section class="details" id="detailsSection">

    <img
        id="poster"
        class="poster"
        src=""
        alt="Movie Poster"
    >

    <div class="info">

        <h1 id="title">Loading...</h1>

        <div class="meta">
            <span id="year"></span>
            <span>•</span>
            <span id="duration"></span>
            <span>•</span>
            <span class="rating" id="rating"></span>
        </div>

        <div class="genres" id="genres"></div>

        <p class="description" id="description"></p>

        <div class="buttons">

            <a
                id="watchButton"
                class="btn watch"
                href="#"
            >
                ▶ Watch Now
            </a>

            <a
                class="btn back"
                href="movies.html"
            >
                ← Back to Movies
            </a>

        </div>

    </div>

</section>


<!-- MOVIES DATA -->
<script src="movies-data.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const movieId = params.get("movie");

const movie = movies.find(item => item.id === movieId);


/* MOVIE NOT FOUND */

if(!movie){

    document.getElementById("detailsSection").innerHTML = `
        <div class="not-found">
            <h1>Movie Not Found</h1>
            <p>The movie you are looking for could not be found.</p>
            <a href="movies.html" class="btn back">
                ← Back to Movies
            </a>
        </div>
    `;

}


/* SHOW MOVIE */

else{

    document.title = movie.title + " | CINEORA";

    document.getElementById("poster").src = movie.poster;

    document.getElementById("poster").alt = movie.title;

    document.getElementById("title").textContent = movie.title;

    document.getElementById("year").textContent = movie.year;

    document.getElementById("duration").textContent = movie.duration;

    document.getElementById("rating").textContent =
        "★ " + movie.rating;

    document.getElementById("description").textContent =
        movie.description;


    /* GENRES */

    const genresContainer =
        document.getElementById("genres");

    movie.genre.forEach(function(genre){

        const tag = document.createElement("span");

        tag.className = "genre";

        tag.textContent = genre;

        genresContainer.appendChild(tag);

    });


    /* WATCH BUTTON */

    document.getElementById("watchButton").href =
        "watch.html?movie=" + encodeURIComponent(movie.id);

}

</script>

</body>
</html>
