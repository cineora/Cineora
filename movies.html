<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movies — CINEORA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* NAVBAR */
.navbar{
    height:70px;
    width:100%;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    background:rgba(0,0,0,.95);
    border-bottom:1px solid #222;
}

.logo{
    color:#e50914;
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
    text-decoration:none;
}

.nav-links{
    display:flex;
    gap:25px;
    list-style:none;
}

.nav-links a{
    color:#fff;
    text-decoration:none;
    font-size:15px;
    font-weight:bold;
}

.nav-links a:hover{
    color:#e50914;
}

/* SEARCH */
.search{
    display:flex;
    gap:7px;
}

.search input{
    width:180px;
    padding:9px 12px;
    background:#151515;
    border:1px solid #444;
    border-radius:5px;
    color:#fff;
    outline:none;
}

.search button{
    background:#e50914;
    color:#fff;
    border:none;
    border-radius:5px;
    padding:0 14px;
    cursor:pointer;
}

/* MAIN */
.container{
    padding:110px 5% 60px;
}

.page-title{
    font-size:38px;
    margin-bottom:25px;
}

/* FILTER */
.categories{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:30px;
}

.category{
    border:1px solid #333;
    background:#1b1b1b;
    color:#ddd;
    padding:9px 17px;
    border-radius:20px;
    cursor:pointer;
}

.category:hover,
.category.active{
    background:#e50914;
    border-color:#e50914;
    color:#fff;
}

/* GRID */
.movie-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:18px;
}

.movie-card{
    background:#151515;
    border-radius:7px;
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
}

.movie-card:hover{
    transform:scale(1.05);
}

.movie-card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
}

.movie-info{
    padding:11px;
}

.movie-info h3{
    font-size:15px;
    margin-bottom:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.movie-info p{
    color:#999;
    font-size:12px;
}

.rating{
    margin-top:7px;
    color:#f5c518;
    font-size:12px;
}

/* NO RESULT */
.no-result{
    display:none;
    text-align:center;
    color:#888;
    padding:50px 10px;
    font-size:18px;
}

/* MOBILE */
@media(max-width:1100px){
    .movie-grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:700px){

    .navbar{
        height:auto;
        min-height:110px;
        padding:12px 4%;
        flex-wrap:wrap;
    }

    .logo{
        font-size:23px;
    }

    .search{
        margin-left:auto;
    }

    .search input{
        width:115px;
    }

    .nav-links{
        order:3;
        width:100%;
        justify-content:center;
        gap:17px;
        overflow-x:auto;
    }

    .nav-links a{
        font-size:13px;
        white-space:nowrap;
    }

    .container{
        padding:135px 4% 45px;
    }

    .page-title{
        font-size:28px;
    }

    .movie-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .movie-info h3{
        font-size:13px;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">CINEORA</a>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="movies.html">Movies</a></li>
        <li><a href="series.html">Series</a></li>
    </ul>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Search">

        <button onclick="searchMovies()">🔍</button>
    </div>

</header>


<main class="container">

    <h1 class="page-title">Movies</h1>

    <div class="categories">

        <button class="category active"
                onclick="filterMovies('all',this)">
            All
        </button>

        <button class="category"
                onclick="filterMovies('Action',this)">
            Action
        </button>

        <button class="category"
                onclick="filterMovies('Horror',this)">
            Horror
        </button>

        <button class="category"
                onclick="filterMovies('Comedy',this)">
            Comedy
        </button>

        <button class="category"
                onclick="filterMovies('Romance',this)">
            Romance
        </button>

        <button class="category"
                onclick="filterMovies('Sci-Fi',this)">
            Sci-Fi
        </button>

        <button class="category"
                onclick="filterMovies('Adventure',this)">
            Adventure
        </button>

        <button class="category"
                onclick="filterMovies('Thriller',this)">
            Thriller
        </button>

    </div>


    <div class="movie-grid" id="movieGrid"></div>

    <div class="no-result" id="noResult">
        No movies found.
    </div>

</main>


<script src="movies-data.js"></script>

<script>

const movieGrid =
    document.getElementById("movieGrid");

const noResult =
    document.getElementById("noResult");


/* SHOW MOVIES */
function displayMovies(list){

    movieGrid.innerHTML = "";

    if(list.length === 0){

        noResult.style.display = "block";
        return;

    }

    noResult.style.display = "none";


    list.forEach(movie => {

        const card =
            document.createElement("div");

        card.className = "movie-card";

        card.innerHTML = `

            <img
                src="${movie.poster}"
                alt="${movie.title}">

            <div class="movie-info">

                <h3>${movie.title}</h3>

                <p>
                    ${movie.genre.join(" • ")}
                    • ${movie.year}
                </p>

                <div class="rating">
                    ★ ${movie.rating}
                </div>

            </div>
        `;


        card.onclick = function(){

            window.location.href =
                "details.html?movie=" +
                encodeURIComponent(movie.id);

        };


        movieGrid.appendChild(card);

    });

}


/* FILTER */
function filterMovies(category,button){

    document
        .querySelectorAll(".category")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");


    if(category === "all"){

        displayMovies(movies);

    }else{

        const filtered =
            movies.filter(movie =>
                movie.genre.includes(category)
            );

        displayMovies(filtered);

    }

}


/* SEARCH */
function searchMovies(){

    const query =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        movies.filter(movie => {

            const title =
                movie.title.toLowerCase();

            const genres =
                movie.genre.join(" ").toLowerCase();

            return title.includes(query) ||
                   genres.includes(query);

        });


    displayMovies(filtered);

}


/* ENTER KEY */
document
    .getElementById("searchInput")
    .addEventListener("keypress",function(e){

        if(e.key === "Enter"){
            searchMovies();
        }

    });


/* INITIAL */
displayMovies(movies);

</script>

</body>
</html>
